<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Couple Cashflow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--good:#15803d;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}
header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}
.brand{font-weight:800;font-size:19px}.brand span{color:var(--accent)}.userbar{display:flex;gap:8px;align-items:center}
.layout{display:flex;max-width:1400px;margin:auto}.side{width:220px;padding:18px 12px;position:sticky;top:64px;height:calc(100vh - 64px)}.side button{width:100%;padding:11px 12px;text-align:left;background:transparent;border-radius:9px;color:#374151;margin-bottom:4px}.side button.active,.side button:hover{background:#eaf0ff;color:#1d4ed8}
main{flex:1;padding:22px;min-width:0}.mobile-nav{display:none}
h1{font-size:25px;margin:0 0 4px}h2{font-size:18px;margin:0 0 14px}.sub{color:var(--muted);font-size:14px}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px #00000008}.metric{font-size:26px;font-weight:800;margin-top:5px}.label{font-size:13px;color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:#d97706}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}.toolbar>*{height:40px}.btn{padding:0 14px;border-radius:9px;background:#eef2f7;color:#111827}.btn.primary{background:var(--accent);color:white}.btn.danger{background:#fee2e2;color:#991b1b}.btn.small{height:32px;padding:0 9px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--muted);font-weight:600}tr:last-child td{border-bottom:0}
form{display:grid;gap:11px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:10px;background:white}.field textarea{min-height:75px;resize:vertical}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}.modalbox{width:min(650px,100%);max-height:90vh;overflow:auto;background:white;border-radius:16px;padding:20px}
.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;background:#eef2ff;color:#3730a3}.empty{padding:28px;text-align:center;color:var(--muted)}
.bar{height:10px;background:#edf0f4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(440px,100%);background:white;border:1px solid var(--line);border-radius:18px;padding:28px}.authbox h1{margin-bottom:18px}.notice{padding:10px 12px;border-radius:9px;background:#eff6ff;color:#1e40af;font-size:13px}
.kpi{display:flex;justify-content:space-between;gap:10px}.right{text-align:right}.muted{color:var(--muted)}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.side{display:none}main{padding:15px;padding-bottom:82px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:62px;background:white;border-top:1px solid var(--line);z-index:20;justify-content:space-around}.mobile-nav button{background:white;color:#6b7280;font-size:11px;padding:7px 10px}.mobile-nav button.active{color:var(--accent);font-weight:700}.formgrid{grid-template-columns:1fr}header{padding:0 14px}.userbar .email{display:none}}
@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.metric{font-size:21px}th:nth-child(4),td:nth-child(4){display:none}}
</style>
</head>
<body><div id="root"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:state.currency||'INR',maximumFractionDigits:2}).format(Number(n)||0);
const today=()=>new Date().toISOString().slice(0,10),monthKey=d=>String(d||today()).slice(0,7);
const SAVED_CONFIG=JSON.parse(localStorage.getItem('cc_config')||'{}');
const SUPABASE_URL=SAVED_CONFIG.url||'https://sqwctakkbagnpiiohqbe.supabase.co';
const SUPABASE_ANON_KEY=SAVED_CONFIG.key||'sb_publishable_TJ_wLgZJEEOmnV0e_wV6IA_xRwHrN5j';
let state={user:null,household:null,members:[],page:'dashboard',currency:'INR',month:monthKey(),transactions:[],accounts:[],categories:[],budgets:[],recurring:[],goals:[],settlements:[],sb:null};
function nav(page){state.page=page;render()}function toast(msg){const x=document.createElement('div');x.textContent=msg;x.style='position:fixed;right:15px;bottom:75px;background:#111827;color:white;padding:12px 15px;border-radius:9px;z-index:99;font-size:13px';document.body.appendChild(x);setTimeout(()=>x.remove(),2400)}
function modal(title,body){document.body.insertAdjacentHTML('beforeend','<div class="modal" id="modal"><div class="modalbox"><div class="kpi"><h2>'+esc(title)+'</h2><button class="btn" onclick="closeModal()">Close</button></div>'+body+'</div></div>')}function closeModal(){$('modal')?.remove()}
function memberName(id){return state.members.find(x=>x.user_id===id)?.display_name||'Household'}
async function init(){try{if(!SUPABASE_ANON_KEY)throw new Error('Supabase connection is not configured in this browser.');state.sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data:{session},error}=await state.sb.auth.getSession();if(error)throw error;state.user=session?.user||null;if(!state.user){renderAuth();return}await loadData();render()}catch(e){console.error(e);renderAuthError(e.message)}}
function renderAuthError(msg){$('root').innerHTML='<div class="auth"><div class="authbox"><div class="brand">Couple <span>Cashflow</span></div><h1>Unable to connect</h1><div class="notice">The app could not connect to its Supabase database. Please refresh the page. If this continues, the browser-safe Supabase publishable key needs to be configured in the deployment.</div><p class="muted" style="font-size:12px">Error: '+esc(msg)+'</p></div></div>'}
async function loadData(){const t=async(table,order='created_at')=>{const {data,error}=await state.sb.from(table).select('*').order(order,{ascending:false});if(error)throw error;return data||[]};try{const {data:h}=await state.sb.from('households').select('*').order('created_at').limit(1);state.household=h?.[0]||null;if(state.household){const {data:m}=await state.sb.from('household_members').select('user_id,display_name,role').eq('household_id',state.household.id);state.members=m||[]}state.accounts=await t('accounts');state.categories=await t('categories');state.transactions=await t('transactions','transaction_date');state.budgets=await t('budgets','month');state.recurring=await t('recurring_transactions','next_run');state.goals=await t('goals');state.settlements=await t('settlements','settled_at');if(state.household?.currency)state.currency=state.household.currency}catch(e){toast(e.message);console.error(e)}}
function renderAuth(){$('root').innerHTML='<div class="auth"><div class="authbox"><div class="brand">Couple <span>Cashflow</span></div><h1>Welcome back</h1><div class="notice">Use one of the household usernames. Each username has its own login.</div><form id="login" style="margin-top:15px"><div class="field"><label>Username</label><input id="username" required autocomplete="username" placeholder="rohit"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn primary">Sign in</button></form></div></div>'; $('login').onsubmit=e=>{e.preventDefault();login()}}
const USER_ACCOUNTS={rohit:{email:'rohit@couplecashflow.local',password:'rohit'},'rohit & kavita':{email:'rohit.kavita@couplecashflow.local',password:'rohit & kavita'},kavita:{email:'kavita@couplecashflow.local',password:'kavita'}};
function normalizeUsername(v){return String(v||'').trim().toLowerCase()}
async function provisionFixedAccounts(){const owner=USER_ACCOUNTS.rohit;for(const key of ['rohit & kavita','kavita']){const a=USER_ACCOUNTS[key];const {error}=await state.sb.auth.signUp({email:a.email,password:a.password,options:{data:{display_name:key}}});if(!error)await state.sb.auth.signInWithPassword({email:owner.email,password:owner.password})}await state.sb.auth.signInWithPassword({email:owner.email,password:owner.password});for(const key of ['rohit & kavita','kavita']){const a=USER_ACCOUNTS[key];await state.sb.rpc('add_household_member_by_email',{p_email:a.email,p_display_name:key==='rohit & kavita'?'Rohit & Kavita':'Kavita'})}}
async function login(){const username=normalizeUsername($('username').value),password=$('password').value,account=USER_ACCOUNTS[username];if(!account)return toast('Username must be rohit, rohit & kavita, or kavita');if(password!==account.password)return toast('Invalid username or password');let {error}=await state.sb.auth.signInWithPassword({email:account.email,password:account.password});if(error){const signup=await state.sb.auth.signUp({email:account.email,password:account.password,options:{data:{display_name:username}}});if(signup.error)return toast('Account not found. In Supabase Auth, turn off Confirm email once, then try again.');({error}=await state.sb.auth.signInWithPassword({email:account.email,password:account.password}));if(error)return toast(error.message)}if(username==='rohit'){await provisionFixedAccounts();}await init()}

function logout(){state.sb.auth.signOut();location.reload()}
function shell(content){$('root').innerHTML='<div class="app"><header><div class="brand">Couple <span>Cashflow</span></div><div class="userbar"><span class="email muted">'+esc(state.user?.email)+'</span><button class="btn small" onclick="logout()">Sign out</button></div></header><div class="layout"><aside class="side">'+sideNav()+'</aside><main>'+content+'</main></div><nav class="mobile-nav">'+[['dashboard','⌂','Home'],['transactions','₹','Transactions'],['add','＋','Add'],['budget','▤','Budget'],['more','☰','More']].map(x=>'<button class="'+(state.page===x[0]?'active':'')+'" onclick="nav(&quot;' + x[0] + '&quot;)"><b>'+x[1]+'</b><br>'+x[2]+'</button>').join('')+'</nav></div>'}
function sideNav(){return [['dashboard','Dashboard'],['transactions','Transactions'],['accounts','Accounts'],['budget','Budget'],['recurring','Recurring bills'],['goals','Savings goals'],['settlements','Who owes whom?'],['reports','Reports'],['household','Household & settings']].map(x=>'<button class="'+(state.page===x[0]?'active':'')+'" onclick="nav(&quot;' + x[0] + '&quot;)">'+x[1]+'</button>').join('')}
function render(){if(!state.user)return renderAuth();let c='';switch(state.page){case'dashboard':c=dashboard();break;case'transactions':c=transactions();break;case'accounts':c=accounts();break;case'budget':c=budget();break;case'recurring':c=recurring();break;case'goals':c=goals();break;case'settlements':c=settlements();break;case'reports':c=reports();break;case'household':c=household();break;case'add':addTransaction();return;case'more':c=more();break}shell(c)}
function dashboard(){const m=state.month,tx=state.transactions.filter(x=>monthKey(x.transaction_date)===m),income=tx.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount),0),expense=tx.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount),0),net=income-expense,cat=state.categories.map(c=>({c,total:tx.filter(x=>x.category_id===c.id&&x.type==='expense').reduce((a,x)=>a+Number(x.amount),0)})).filter(x=>x.total).sort((a,b)=>b.total-a.total).slice(0,6);return '<div class="kpi"><div><h1>Dashboard</h1><div class="sub">Household cash flow • '+m+'</div></div><button class="btn primary" onclick="addTransaction()">＋ Add transaction</button></div><div class="toolbar"><input type="month" value="'+m+'" onchange="state.month=this.value;render()"></div><div class="grid cards"><div class="card"><div class="label">Income</div><div class="metric good">'+money(income)+'</div></div><div class="card"><div class="label">Expenses</div><div class="metric bad">'+money(expense)+'</div></div><div class="card"><div class="label">Net cash flow</div><div class="metric '+(net>=0?'good':'bad')+'">'+money(net)+'</div></div><div class="card"><div class="label">Savings rate</div><div class="metric">'+(income?Math.round(net/income*100):0)+'%</div></div></div><div class="grid two" style="margin-top:14px"><div class="card"><h2>Top spending</h2>'+(cat.length?cat.map(x=>'<div style="margin:12px 0"><div class="kpi"><span>'+esc(x.c.name)+'</span><b>'+money(x.total)+'</b></div><div class="bar"><i style="width:'+Math.min(100,expense?x.total/expense*100:0)+'%"></i></div></div>').join(''):'<div class="empty">No expenses this month.</div>')+'</div><div class="card"><h2>Recent transactions</h2>'+(state.transactions.slice(0,7).map(x=>'<div class="kpi" style="padding:9px 0;border-bottom:1px solid var(--line)"><span><b>'+esc(x.merchant||x.note||'Transaction')+'</b><br><small class="muted">'+esc(x.transaction_date)+' • '+esc(state.categories.find(c=>c.id===x.category_id)?.name||x.type)+'</small></span><b class="'+(x.type==='expense'?'bad':'good')+'">'+(x.type==='expense'?'-':'+')+money(x.amount)+'</b></div>').join('')||'<div class="empty">No transactions yet.</div>')+'</div></div>'}
function addTransaction(existing){const x=existing||{};modal(existing?'Edit transaction':'Add transaction','<form id="txform"><div class="field"><label>Date</label><input id="tx_date" type="date" required value="'+(x.transaction_date||today())+'"></div><div class="field"><label>Title</label><input id="tx_title" required maxlength="150" value="'+esc(x.merchant||'')+'" placeholder="e.g. Grocery shopping"></div><div class="field"><label>Amount</label><input id="tx_amount" type="number" step="0.01" min="0" required value="'+(x.amount||'')+'"></div><div class="field"><label>Note</label><textarea id="tx_note" maxlength="500" placeholder="Optional note">'+esc(x.note||'')+'</textarea></div><button class="btn primary">Save transaction</button></form>');$('txform').onsubmit=async e=>{e.preventDefault();const payload={type:'expense',amount:Number($('tx_amount').value),transaction_date:$('tx_date').value,merchant:$('tx_title').value.trim(),note:$('tx_note').value.trim()||null};const q=x.id?state.sb.from('transactions').update(payload).eq('id',x.id):state.sb.from('transactions').insert(payload);const {error}=await q;if(error)return toast(error.message);closeModal();await loadData();render();toast(x.id?'Updated':'Added')}}
function transactions(){const rows=state.transactions.filter(x=>monthKey(x.transaction_date)===state.month);return '<div class="kpi"><div><h1>Transactions</h1><div class="sub">Date, title, amount and note</div></div><button class="btn primary" onclick="addTransaction()">＋ Add entry</button></div><div class="toolbar"><input id="search" placeholder="Search title / note" oninput="filterTx()" style="flex:1;min-width:180px"><input type="month" value="'+state.month+'" onchange="state.month=this.value;render()"></div><div class="card"><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Title</th><th>Amount</th><th>Note</th><th>Actions</th></tr></thead><tbody id="txrows">'+txRows(rows)+'</tbody></table></div></div>'}
function txRows(arr){return arr.length?arr.map(x=>'<tr><td>'+esc(x.transaction_date)+'</td><td><b>'+esc(x.merchant||'—')+'</b></td><td class="bad">-'+money(x.amount)+'</td><td>'+esc(x.note||'—')+'</td><td><button class="btn small" onclick="editTx(&quot;'+x.id+'&quot;)">Edit</button> <button class="btn small danger" onclick="deleteTx(&quot;'+x.id+'&quot;)">Delete</button></td></tr>').join(''):'<tr><td colspan="5" class="empty">No entries for this month.</td></tr>'}
function filterTx(){const q=($('search')?.value||'').toLowerCase();let a=state.transactions.filter(x=>monthKey(x.transaction_date)===state.month);a=a.filter(x=>(x.merchant||'').toLowerCase().includes(q)||(x.note||'').toLowerCase().includes(q));$('txrows').innerHTML=txRows(a)}
function editTx(id){const x=state.transactions.find(t=>t.id===id);if(x)addTransaction(x)}
async function deleteTx(id){if(!confirm('Delete this entry?'))return;const {error}=await state.sb.from('transactions').delete().eq('id',id);if(error)return toast(error.message);await loadData();render();toast('Deleted')}
function accounts(){return '<div class="kpi"><div><h1>Accounts</h1><div class="sub">Banks, cash, wallets and credit cards</div></div><button class="btn primary" onclick="accountModal()">＋ Account</button></div><div class="grid three">'+(state.accounts.map(a=>'<div class="card"><div class="kpi"><b>'+esc(a.name)+'</b><span class="badge">'+esc(a.type)+'</span></div><div class="metric">'+money(a.opening_balance)+'</div><div class="sub">Opening balance</div></div>').join('')||'<div class="card empty">Add your first account.</div>')+'</div>'}
function accountModal(){modal('Add account','<form id="af"><div class="field"><label>Name</label><input id="an" required placeholder="HDFC Bank / Cash / Credit Card"></div><div class="field"><label>Type</label><select id="at"><option>bank</option><option>cash</option><option>wallet</option><option>credit_card</option><option>investment</option><option>loan</option></select></div><div class="field"><label>Opening balance</label><input id="ab" type="number" step=".01" value="0"></div><button class="btn primary">Save</button></form>');$('af').onsubmit=async e=>{e.preventDefault();const {error}=await state.sb.from('accounts').insert({name:$('an').value,type:$('at').value,opening_balance:Number($('ab').value)});if(error)return toast(error.message);closeModal();await loadData();render()}}
function budget(){const rows=state.categories.map(c=>{const b=state.budgets.find(x=>x.category_id===c.id&&monthKey(x.month)===state.month);const spent=state.transactions.filter(t=>monthKey(t.transaction_date)===state.month&&t.category_id===c.id&&t.type==='expense').reduce((a,x)=>a+Number(x.amount),0);return{c,b,spent}}).filter(x=>x.b||x.spent);return '<div class="kpi"><div><h1>Monthly budget</h1><div class="sub">Plan and track category limits</div></div><button class="btn primary" onclick="budgetModal()">＋ Set budget</button></div><div class="toolbar"><input type="month" value="'+state.month+'" onchange="state.month=this.value;render()"></div><div class="card"><table><thead><tr><th>Category</th><th>Budget</th><th>Spent</th><th>Remaining</th></tr></thead><tbody>'+ (rows.map(x=>'<tr><td>'+esc(x.c.name)+'</td><td>'+money(x.b?.amount||0)+'</td><td>'+money(x.spent)+'</td><td class="'+((Number(x.b?.amount||0)-x.spent)<0?'bad':'good')+'">'+money(Number(x.b?.amount||0)-x.spent)+'</td></tr>').join('')||'<tr><td colspan="4" class="empty">Set your first category budget.</td></tr>')+'</tbody></table></div>'}
function budgetModal(){modal('Set monthly budget','<form id="bf"><div class="field"><label>Month</label><input id="bm" type="month" value="'+state.month+'"></div><div class="field"><label>Category</label><select id="bc">'+state.categories.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label>Budget amount</label><input id="ba" type="number" step=".01" required></div><button class="btn primary">Save budget</button></form>');$('bf').onsubmit=async e=>{e.preventDefault();const {error}=await state.sb.from('budgets').upsert({month:$('bm').value+'-01',category_id:$('bc').value,amount:Number($('ba').value),rollover:false},{onConflict:'household_id,month,category_id'});if(error)return toast(error.message);closeModal();await loadData();render()}}
function recurring(){return '<div class="kpi"><div><h1>Recurring bills</h1><div class="sub">Rent, EMI, utilities, subscriptions and SIPs</div></div><button class="btn primary" onclick="recurringModal()">＋ Recurring</button></div><div class="grid two">'+(state.recurring.map(x=>'<div class="card"><div class="kpi"><b>'+esc(x.name)+'</b><span>'+money(x.amount)+'</span></div><p class="sub">'+esc(x.frequency)+' • next '+esc(x.next_run)+'</p></div>').join('')||'<div class="card empty">No recurring bills configured.</div>')+'</div>'}
function recurringModal(){modal('Recurring payment','<form id="rf"><div class="formgrid"><div class="field"><label>Name</label><input id="rn" required placeholder="Electricity"></div><div class="field"><label>Amount</label><input id="ram" type="number" step=".01" required></div><div class="field"><label>Frequency</label><select id="rfq"><option>monthly</option><option>weekly</option><option>yearly</option></select></div><div class="field"><label>Next run</label><input id="rnext" type="date" value="'+today()+'"></div></div><button class="btn primary">Save</button></form>');$('rf').onsubmit=async e=>{e.preventDefault();const {error}=await state.sb.from('recurring_transactions').insert({name:$('rn').value,amount:Number($('ram').value),frequency:$('rfq').value,next_run:$('rnext').value});if(error)return toast(error.message);closeModal();await loadData();render()}}
function goals(){return '<div class="kpi"><div><h1>Savings goals</h1><div class="sub">Emergency fund, vacation, home and custom goals</div></div><button class="btn primary" onclick="goalModal()">＋ Goal</button></div><div class="grid three">'+(state.goals.map(g=>{const p=Math.min(100,Number(g.current_amount||0)/Number(g.target_amount||1)*100);return '<div class="card"><h2>'+esc(g.name)+'</h2><div class="kpi"><b>'+money(g.current_amount)+'</b><span class="muted">of '+money(g.target_amount)+'</span></div><div class="bar"><i style="width:'+p+'%"></i></div><p class="sub">'+Math.round(p)+'% complete</p></div>'}).join('')||'<div class="card empty">Create a savings goal.</div>')+'</div>'}
function goalModal(){modal('Savings goal','<form id="gf"><div class="field"><label>Name</label><input id="gn" required placeholder="Emergency fund"></div><div class="formgrid"><div class="field"><label>Target amount</label><input id="gt" type="number" step=".01" required></div><div class="field"><label>Current amount</label><input id="gc" type="number" step=".01" value="0"></div><div class="field"><label>Target date</label><input id="gd" type="date"></div></div><button class="btn primary">Save goal</button></form>');$('gf').onsubmit=async e=>{e.preventDefault();const {error}=await state.sb.from('goals').insert({name:$('gn').value,target_amount:Number($('gt').value),current_amount:Number($('gc').value),target_date:$('gd').value||null});if(error)return toast(error.message);closeModal();await loadData();render()}}
function settlements(){return '<div class="kpi"><div><h1>Who owes whom?</h1><div class="sub">Track private reimbursements and settlements</div></div><button class="btn primary" onclick="settleModal()">＋ Settlement</button></div><div class="grid two"><div class="card"><h2>Settlement history</h2>'+(state.settlements.map(x=>'<div class="kpi" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>'+esc(memberName(x.from_user))+' → '+esc(memberName(x.to_user))+'<br><small class="muted">'+esc(x.settled_at||'')+'</small></span><b>'+money(x.amount)+'</b></div>').join('')||'<div class="empty">No settlements yet.</div>')+'</div><div class="card"><h2>How to use</h2><p class="sub">Record a reimbursement when one person pays the other back for shared spending.</p></div></div>'}
function settleModal(){modal('Record settlement','<form id="sf"><div class="formgrid"><div class="field"><label>From</label><select id="sfrom">'+state.members.map(m=>'<option value="'+m.user_id+'">'+esc(m.display_name)+'</option>').join('')+'</select></div><div class="field"><label>To</label><select id="sto">'+state.members.map(m=>'<option value="'+m.user_id+'">'+esc(m.display_name)+'</option>').join('')+'</select></div><div class="field"><label>Amount</label><input id="sam" type="number" step=".01" required></div><div class="field"><label>Date</label><input id="sd" type="date" value="'+today()+'"></div></div><button class="btn primary">Save</button></form>');$('sf').onsubmit=async e=>{e.preventDefault();if($('sfrom').value===$('sto').value)return toast('Choose two different people');const {error}=await state.sb.from('settlements').insert({from_user:$('sfrom').value,to_user:$('sto').value,amount:Number($('sam').value),settled_at:$('sd').value});if(error)return toast(error.message);closeModal();await loadData();render()}}
function reports(){const byCat={};state.transactions.filter(x=>monthKey(x.transaction_date)===state.month&&x.type==='expense').forEach(x=>{const n=state.categories.find(c=>c.id===x.category_id)?.name||'Uncategorized';byCat[n]=(byCat[n]||0)+Number(x.amount)});return '<div class="kpi"><div><h1>Reports</h1><div class="sub">Monthly spending and household analysis</div></div><button class="btn" onclick="exportCSV()">Export CSV</button></div><div class="toolbar"><input type="month" value="'+state.month+'" onchange="state.month=this.value;render()"></div><div class="grid two"><div class="card"><h2>Category spending</h2><table><tbody>'+ (Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td class="right">'+money(v)+'</td></tr>').join('')||'<tr><td class="empty">No spending.</td></tr>')+'</tbody></table></div><div class="card"><h2>Person-wise spending</h2>'+state.members.map(m=>{const v=state.transactions.filter(x=>monthKey(x.transaction_date)===state.month&&x.type==='expense'&&x.paid_by===m.user_id).reduce((a,x)=>a+Number(x.amount),0);return '<div class="kpi" style="padding:12px 0;border-bottom:1px solid var(--line)"><span>'+esc(m.display_name)+'</span><b>'+money(v)+'</b></div>'}).join('')+'</div></div>'}
function exportCSV(){const rows=[['date','type','amount','category','account','paid_by','merchant','note'],...state.transactions.map(x=>[x.transaction_date,x.type,x.amount,state.categories.find(c=>c.id===x.category_id)?.name||'',state.accounts.find(a=>a.id===x.account_id)?.name||'',memberName(x.paid_by),x.merchant||'',x.note||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='couple-cashflow.csv';a.click()}
function household(){return '<h1>Household & settings</h1><p class="sub">Private two-person household configuration</p><div class="grid two" style="margin-top:16px"><div class="card"><h2>Members</h2>'+state.members.map(m=>'<div class="kpi" style="padding:12px 0;border-bottom:1px solid var(--line)"><span><b>'+esc(m.display_name)+'</b><br><small class="muted">'+esc(m.role)+'</small></span><span class="badge">'+(m.user_id===state.user.id?'You':'')+'</span></div>').join('')+'<button class="btn primary" style="margin-top:12px" onclick="memberModal()">＋ Add wife / member</button></div><div class="card"><h2>Preferences</h2><div class="field"><label>Currency</label><select id="currency" onchange="setCurrency(this.value)"><option value="INR" '+(state.currency==='INR'?'selected':'')+'>₹ INR</option><option value="USD" '+(state.currency==='USD'?'selected':'')+'>$ USD</option><option value="EUR" '+(state.currency==='EUR'?'selected':'')+'>€ EUR</option><option value="GBP" '+(state.currency==='GBP'?'selected':'')+'>£ GBP</option></select></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><button class="btn danger" onclick="resetConfig()">Disconnect this browser</button></div></div>'}
async function setCurrency(v){state.currency=v;if(state.household)await state.sb.from('households').update({currency:v}).eq('id',state.household.id);render()}
function memberModal(){modal('Add household member','<form id="mf"><div class="notice">The other person must first create an account using this app.</div><div class="field"><label>Email</label><input id="me" type="email" required></div><div class="field"><label>Display name</label><input id="mn" required placeholder="Wife"></div><button class="btn primary">Add member</button></form>');$('mf').onsubmit=async e=>{e.preventDefault();const {error}=await state.sb.rpc('add_household_member_by_email',{p_email:$('me').value.trim(),p_display_name:$('mn').value.trim()});if(error)return toast(error.message);closeModal();await loadData();render();toast('Member added')}}
function more(){return '<h1>More</h1><div class="grid two" style="margin-top:16px"><div class="card"><h2>Quick actions</h2><button class="btn primary" onclick="addTransaction()">＋ Add transaction</button> <button class="btn" onclick="exportCSV()">Export CSV</button></div><div class="card"><h2>About</h2><p class="sub">Private two-person household expense tracking with Supabase authentication and Row Level Security.</p></div></div>'}
function resetConfig(){if(confirm('Sign out and disconnect this browser?')){state.sb?.auth.signOut();location.reload()}}
init();
</script></body></html>
